<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Meesam!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(-45deg, #38bdf8, #a855f7, #ec4899, #fbbf24);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--primary-gradient);
            background-size: 400% 400%;
            animation: gradientBG 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .font-birthday { font-family: 'Luckiest Guy', cursive; }

        /* Super Smooth Floating */
        @keyframes smoothFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        .float-animation { animation: smoothFloat 4s ease-in-out infinite; }

        /* Confetti Elements */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FFD700;
            top: -20px;
            opacity: 0.8;
            border-radius: 2px;
            animation: fall 5s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* Shimmer Effect for Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hover-lift:hover {
            transform: translateY(-8px) scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-12 relative">

    <div class="absolute top-20 left-10 w-64 h-64 bg-white/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-64 h-64 bg-yellow-400/20 rounded-full blur-3xl animate-pulse"></div>

    <div class="confetti" style="left:10%; animation-delay:1s; background:#f472b6;"></div>
    <div class="confetti" style="left:25%; animation-delay:3s; background:#fbbf24;"></div>
    <div class="confetti" style="left:50%; animation-delay:0s; background:#38bdf8;"></div>
    <div class="confetti" style="left:75%; animation-delay:2s; background:#818cf8;"></div>
    <div class="confetti" style="left:90%; animation-delay:4s; background:#4ade80;"></div>

    <div class="relative z-10 glass-card rounded-[3.5rem] p-6 md:p-12 max-w-2xl w-full text-center transform transition-all duration-700">
        
        <div class="absolute -top-14 -left-6 text-7xl float-animation" style="animation-delay: 0.2s;">🎁</div>
        <div class="absolute -top-12 -right-8 text-7xl float-animation">🎈</div>

        <div class="relative h-64 md:h-80 w-full mb-10 rounded-[2.5rem] overflow-hidden shadow-2xl group border-4 border-white">
            <img 
                src="Gemini_Generated_Image_wkpb5hwkpb5hwkpb.png" 
                alt="Birthday Hero" 
                class="w-full h-full object-cover transition-transform duration-[2000ms] group-hover:scale-110"
            >
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
            <div class="absolute bottom-6 left-0 right-0 text-white font-birthday text-3xl tracking-widest uppercase drop-shadow-lg">
                Our Little Legend
            </div>
        </div>

        <div class="space-y-8">
            <div class="flex flex-col items-center gap-3">
                <div class="relative group">
                    <div class="absolute -inset-2 bg-gradient-to-r from-yellow-400 to-pink-500 rounded-full blur opacity-40 group-hover:opacity-100 transition duration-1000"></div>
                    <img src="WhatsApp Image 2026-04-26 at 12.05.09 PM.jpeg" 
                         class="relative w-28 h-28 rounded-full border-4 border-white object-cover shadow-xl" alt="Meesam">
                    <div class="absolute -bottom-2 -right-2 bg-white rounded-full p-2 shadow-lg text-2xl animate-bounce">👑</div>
                </div>
                <div class="mt-2">
                    <p class="text-blue-600 font-black uppercase tracking-[0.4em] text-[10px]">Today is all about</p>
                    <h3 class="font-birthday text-5xl text-blue-500 mt-1">MEESAM</h3>
                </div>
            </div>
            
            <h1 class="font-birthday text-6xl md:text-8xl leading-none">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-red-500 to-pink-500 drop-shadow-sm">
                    HAPPY<br>BIRTHDAY!
                </span>
            </h1>

            <div class="bg-gradient-to-br from-white to-blue-50/50 rounded-[2.5rem] p-8 border-2 border-dashed border-blue-200 relative overflow-hidden">
                <p class="text-blue-900 font-bold text-xl leading-relaxed italic relative z-10">
                    "Watching you grow is the best gift of all. May your year be as bright as your smile and as wonderful as the joy you bring to everyone around you!" 🎂✨
                </p>
                <div class="absolute top-0 right-0 p-4 opacity-5 text-9xl font-birthday">?</div>
            </div>

            <div class="grid grid-cols-3 gap-5 pt-4">
              <div class="aspect-square rounded-[2rem] overflow-hidden border-4 border-white shadow-lg bg-white transform -rotate-3 hover:rotate-0 transition-all duration-500 cursor-pointer">
                  <video class="w-full h-full object-cover" autoplay loop muted playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 12.10.31 PM.mp4" type="video/mp4">
                  </video>
              </div>
          
              <div class="aspect-square rounded-[2rem] overflow-hidden border-4 border-white shadow-lg bg-white transform translate-y-[-12px] hover:scale-105 transition-all duration-500 cursor-pointer">
                  <video class="w-full h-full object-cover" autoplay loop muted playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 11.56.12 AM.mp4" type="video/mp4">
                  </video>
              </div>
          
              <div class="aspect-square rounded-[2rem] overflow-hidden border-4 border-white shadow-lg bg-white transform rotate-3 hover:rotate-0 transition-all duration-500 cursor-pointer">
                  <video class="w-full h-full object-cover" autoplay loop muted playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 9.14.47 AM.mp4" type="video/mp4">
                  </video>
              </div>
            </div>

            <div class="pt-10">
                <button class="group relative bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500 text-white font-black px-16 py-6 rounded-2xl text-2xl uppercase tracking-[0.2em] shadow-[0_20px_40px_rgba(245,158,11,0.3)] hover:shadow-[0_25px_50px_rgba(245,158,11,0.5)] transition-all hover:-translate-y-2 active:scale-95">
                    <span class="relative z-10">Let's Party! 🎉</span>
                </button>
            </div>
        </div>

        <div class="absolute -bottom-10 -left-10 text-7xl rotate-12 float-animation" style="animation-delay: 1s;">🎂</div>
        <div class="absolute -bottom-12 -right-8 text-7xl -rotate-12 float-animation" style="animation-delay: 0.5s;">🎨</div>
    </div>

</body>
</html>
