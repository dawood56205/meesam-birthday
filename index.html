<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-birthday { font-family: 'Luckiest Guy', cursive; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-sky-400 min-h-screen flex items-center justify-center p-4 py-12 overflow-x-hidden relative">

    <div class="absolute top-10 left-10 w-24 h-24 bg-yellow-300 rounded-full blur-2xl opacity-50 animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-32 h-32 bg-pink-400 rounded-full blur-3xl opacity-50 animate-pulse"></div>

    <div class="relative z-10 bg-white rounded-[3rem] shadow-2xl p-6 md:p-10 max-w-2xl w-full text-center border-8 border-white/30 transform transition-all">
        
        <div class="relative h-50 md:h-65 w-full mb-8 rounded-[2rem] overflow-hidden shadow-inner bg-gray-100">
            <img 
                src="Gemini_Generated_Image_wkpb5hwkpb5hwkpb.png" 
                alt="Birthday Hero" 
                class="w-full h-full object-cover hover:scale-110 transition-transform duration-1000"
            >
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
        </div>

        <div class="space-y-6">
            <div class="flex items-center justify-center gap-3">
                <img src="WhatsApp Image 2026-04-26 at 12.05.09 PM.jpeg" 
                     class="w-20 h-20 rounded-full border-2 border-blue-500 object-cover" alt="Nephew">
                <h2 class="text-blue-500 font-black uppercase tracking-[0.3em] text-[15px]">Happy Birthday To Meesam</h2>
            </div>
            
            <h1 class="font-birthday text-5xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-red-500 to-pink-500 leading-tight">
                HAPPY BIRTHDAY!
            </h1>

            <div class="bg-blue-50 rounded-3xl p-6 border-2 border-dashed border-blue-200">
                <p class="text-blue-900 font-bold text-lg leading-relaxed">
                    Wishing you a day filled with extra cake, huge presents, and the most epic adventures!
                </p>
            </div>

            <div class="grid grid-cols-3 gap-3 pt-4">
              <div class="h-100 rounded-2xl overflow-hidden border-2 border-white shadow-md bg-gray-100">
                  <video 
                      class="w-full h-full object-cover" 
                      autoplay 
                      loop 
                      muted 
                      playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 12.10.31 PM.mp4" type="video/mp4">
                      Your browser does not support the video tag.
                  </video>
              </div>
          
              <div class="h-100 rounded-2xl overflow-hidden border-2 border-white shadow-md bg-gray-100">
                  <video 
                      class="w-full h-full object-cover" 
                      autoplay 
                      loop 
                      muted 
                      playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 11.56.12 AM.mp4" type="video/mp4">
                      Your browser does not support the video tag.
                  </video>
              </div>
          
              <div class="h-100 rounded-2xl overflow-hidden border-2 border-white shadow-md bg-gray-100">
                  <video 
                      class="w-full h-full object-cover" 
                      autoplay 
                      loop 
                      muted 
                      playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 9.14.47 AM.mp4" type="video/mp4">
                      Your browser does not support the video tag.
                  </video>
              </div>
          </div>
            <div class="pt-6">
                <button class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black px-10 py-4 rounded-full text-lg uppercase tracking-widest shadow-lg hover:translate-y-1 transition-all">
                    Let's Party!
                </button>
            </div>
        </div>

        <div class="absolute -top-10 -right-5 text-6xl float-animation">🎈</div>
        <div class="absolute -bottom-6 -left-6 text-5xl rotate-12">⭐</div>
    </div>

</body>
</html>
