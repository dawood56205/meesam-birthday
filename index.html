<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Meesam!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(-45deg, #38bdf8, #818cf8, #f472b6, #fbbf24);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .font-birthday { font-family: 'Luckiest Guy', cursive; }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }

        /* Confetti simulation */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-12 overflow-x-hidden relative">

    <div class="absolute top-10 left-10 w-32 h-32 bg-yellow-300 rounded-full blur-3xl opacity-40 animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-48 h-48 bg-pink-400 rounded-full blur-3xl opacity-40 animate-pulse"></div>

    <div class="relative z-10 bg-white/90 backdrop-blur-sm rounded-[3rem] shadow-2xl p-6 md:p-10 max-w-2xl w-full text-center border-8 border-white/50 transform transition-all">
        
        <div class="absolute -top-12 -left-6 text-6xl float-animation" style="animation-delay: 0.5s;">🎁</div>
        <div class="absolute -top-10 -right-5 text-6xl float-animation">🎈</div>

        <div class="relative h-60 md:h-72 w-full mb-8 rounded-[2rem] overflow-hidden shadow-xl bg-gray-100 group">
            <img 
                src="Gemini_Generated_Image_wkpb5hwkpb5hwkpb.png" 
                alt="Birthday Hero" 
                class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000"
            >
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
            <div class="absolute bottom-4 left-0 right-0 text-white font-birthday text-2xl tracking-widest drop-shadow-lg">
                IT'S PARTY TIME!
            </div>
        </div>

        <div class="space-y-6">
            <div class="flex flex-col items-center justify-center gap-2">
                <div class="relative">
                    <img src="WhatsApp Image 2026-04-26 at 12.05.09 PM.jpeg" 
                         class="w-24 h-24 rounded-full border-4 border-yellow-400 object-cover shadow-lg" alt="Meesam">
                    <span class="absolute -bottom-1 -right-1 text-3xl">👑</span>
                </div>
                <h2 class="text-blue-600 font-black uppercase tracking-[0.2em] text-sm mt-2">A Very Special Day For</h2>
                <h3 class="font-birthday text-4xl text-blue-500">MEESAM</h3>
            </div>
            
            <h1 class="font-birthday text-6xl md:text-8xl text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-red-500 to-pink-500 leading-tight drop-shadow-sm">
                HAPPY BIRTHDAY!
            </h1>

            <div class="bg-blue-50/80 rounded-3xl p-6 border-2 border-dashed border-blue-300">
                <p class="text-blue-900 font-bold text-lg leading-relaxed italic">
                  "Watching you grow is the best gift of all. May your year be as bright as your smile and as wonderful as the joy you bring to everyone around you!" 🎂✨
                </p>
            </div>

            <div class="grid grid-cols-3 gap-4 pt-4">
              <div class="aspect-square rounded-2xl overflow-hidden border-4 border-white shadow-lg bg-gray-100 transform -rotate-3 hover:rotate-0 transition-transform">
                  <video class="w-full h-full object-cover" autoplay loop muted playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 12.10.31 PM.mp4" type="video/mp4">
                  </video>
              </div>
          
              <div class="aspect-square rounded-2xl overflow-hidden border-4 border-white shadow-lg bg-gray-100 transform translate-y-[-10px] hover:scale-105 transition-transform">
                  <video class="w-full h-full object-cover" autoplay loop muted playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 11.56.12 AM.mp4" type="video/mp4">
                  </video>
              </div>
          
              <div class="aspect-square rounded-2xl overflow-hidden border-4 border-white shadow-lg bg-gray-100 transform rotate-3 hover:rotate-0 transition-transform">
                  <video class="w-full h-full object-cover" autoplay loop muted playsinline>
                      <source src="WhatsApp Video 2026-04-26 at 9.14.47 AM.mp4" type="video/mp4">
                  </video>
              </div>
            </div>

            <div class="pt-6">
                <button class="group relative bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black px-12 py-5 rounded-full text-xl uppercase tracking-widest shadow-[0_10px_20px_rgba(245,158,11,0.4)] hover:shadow-[0_15px_30px_rgba(245,158,11,0.6)] transition-all active:scale-95">
                    <span class="relative z-10">Let's Party! 🎉</span>
                </button>
            </div>
        </div>

        <div class="absolute -bottom-8 -left-8 text-5xl rotate-12 float-animation" style="animation-delay: 1.2s;">🍰</div>
        <div class="absolute -bottom-10 -right-5 text-6xl -rotate-12 float-animation" style="animation-delay: 0.8s;">✨</div>
    </div>

</body>
</html>
